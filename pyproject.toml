[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-plugin-gen"
version = "1.0.0"
description = "Generate a complete, review-ready OpenAI (ChatGPT / Codex) plugin package from a remote MCP server: OAuth/SSO login, live tool discovery, manifests, skill, assets, validation and zip."
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "PyYAML>=6",
  "Pillow>=10",
]

[project.optional-dependencies]
sso = ["playwright>=1.45"]     # headless browser auto-login for SSO (mobile / ID / OTP forms)
dev = ["pytest>=8"]

[project.scripts]
mcp-plugin-gen = "mcp_plugin_gen.cli:main"

[tool.setuptools.packages.find]
include = ["mcp_plugin_gen*"]
